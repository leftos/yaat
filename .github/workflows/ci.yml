name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # yaat sits in yaat/ so yaat-server, checked out beside it below, finds it as its ../yaat sibling.
    defaults:
      run:
        working-directory: yaat
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: yaat
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"

      # Fail fast if docs/command-cheatsheet.json was edited without regenerating
      # docs/command-cheatsheet.html. The HTML ships next to Yaat.Client.exe and
      # Help → Command Cheatsheet opens it in the user's browser; a stale HTML
      # would show users an out-of-date command list.
      - name: Check command cheatsheet HTML is in sync with JSON
        run: node tools/build-cheatsheet.mjs --check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: "10.26.1"

      # The Discord bot is a Cloudflare Worker deployed separately from the app, so its rate-limit
      # retry/queue logic has no other coverage in this build.
      - name: Test Discord bot worker
        working-directory: yaat/tools/discord-bot
        run: pnpm install --frozen-lockfile && pnpm test

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      # tools/Yaat.VStrips.Web targets net10.0-browser and needs the
      # wasm-tools workload (Emscripten + Mono WASM toolchain) for restore
      # to succeed. Without it, `dotnet restore` against the full solution
      # fails with NETSDK1147.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore

      # Formatting and style are build gates, not suggestions. CSharpier owns whitespace and line breaks (C# and
      # XAML); `dotnet format style` verifies every info-level IDE rule. A bare `dotnet format` is never run: its
      # whitespace pass fights CSharpier.
      - name: Restore tools
        run: dotnet tool restore

      - name: Formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Style diagnostics
        run: dotnet format style yaat.slnx --verify-no-changes --severity info --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /warnaserror

      # `Category=Nightly` is the trait on TaxiCoverage{Oak,Sfo}GridTests
      # (parametric every-parking sweeps, ~1200 cases). Per-PR CI runs
      # everything else; the .github/workflows/nightly-taxi-grid.yml
      # workflow runs the Nightly grid on a schedule.
      - name: Test
        run: dotnet test --no-build --configuration Release -- --filter-not-trait "Category=Nightly" --report-xunit-trx --report-xunit-trx-filename results.trx

      # Every airport in src/Yaat.Sim/Data/PrecomputeCache/airports.txt should have a committed entry computed from this
      # commit's sources. Offline: the build-time source hashes, the sidecar hash and the layout format version. A stale
      # or missing entry is a ::warning:: annotation naming the airport and the stale half; an unreadable one fails.
      - name: Precompute cache check
        run: dotnet run --no-build -c Release --project tools/Yaat.PrecomputeCache -- --check

      # yaat-server compiles against this commit's Yaat.Sim (its Directory.Build.props prefers the ../yaat sibling), so a
      # Yaat.Sim change that breaks the server fails here, on the yaat commit that caused it. A PR uses yaat-server's
      # same-named branch when one exists (feature pairs share a branch name), else main. yaat-server is private: a
      # fork PR has no secret to read it with and skips these steps.
      - name: Pick the yaat-server ref
        id: server-ref
        if: github.event.pull_request.head.repo.fork != true
        env:
          HEAD_REF: ${{ github.head_ref }}
          SERVER_TOKEN: ${{ secrets.NIGHTLY_REVIEW_TOKEN }}
        run: |
          ref=main
          if [[ "$HEAD_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] &&
            git ls-remote --exit-code --heads "https://x-access-token:${SERVER_TOKEN}@github.com/leftos/yaat-server.git" "$HEAD_REF" > /dev/null; then
            ref="$HEAD_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "yaat-server ref: $ref"

      - name: Checkout yaat-server
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: leftos/yaat-server
          ref: ${{ steps.server-ref.outputs.ref }}
          path: yaat-server
          persist-credentials: false
          lfs: false
          token: ${{ secrets.NIGHTLY_REVIEW_TOKEN }}

      - name: Build yaat-server
        if: github.event.pull_request.head.repo.fork != true
        working-directory: yaat-server
        run: dotnet build --configuration Release /warnaserror

      # Same filters as yaat-server's own CI: Benchmark reads LFS recordings from its extern/yaat submodule, which is not
      # checked out here; Nightly is its scheduled soak.
      - name: Test yaat-server
        if: github.event.pull_request.head.repo.fork != true
        working-directory: yaat-server
        run: dotnet test --no-build --configuration Release -- --filter-not-trait "Category=Benchmark" --filter-not-trait "Category=Nightly"
