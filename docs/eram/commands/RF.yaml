id: RF
variants:
  - title: Request Flight Plan Transfer
    descriptor: PLAN TRANSFER
    format: RF 02* 13 | RF 02 13
    multiple_flids: false
    handler: not implemented
    fields:
      - field: 02 Flight Identification
        rule: |
          Must be one of: a. Aircraft ID with optional departure point - Laa(a)(a)(a)(a)(/aa(a)(a)(a)) or
          Ld(/aa(a)(a)(a)) or Laa(a)(a)(a)(a)(/aa(a)(a)(a)ddd1ddd2) or Ld(/aa(a)(a)(a)ddd1ddd2) or
          Laa(a)(a)(a)(a)(/dddd(L1)/(d)dddd(L2)) or Ld(/dddd(L1)/(d)dddd(L2)); b. CID - ddd or daa (where
          a must not equal "I" or "O"); c. Beacon Code - dddd (all digits octal); d. Trackball Pick or
          Trackball Enter.
          Field 02 may be suffixed with the logic check override (/OK) when the source is an R, D, or
          A Position.
        error: MsgFlidFormat
      - field: 02 Flight Identification
        rule: |
          When selecting the flight by trackball, the selection must capture a Track Position Symbol
          (Paired Flight), Tear-Off Flight Entry or a View Flight Entry for a valid flight ID
          (R-Position only).
        error: MsgNoTBFlightID
      - field: 02 Flight Identification
        rule: |
          When a beacon code, must be a discrete beacon code, i.e. last two digits must not be 00.
        error: MsgIllegalFlightID
      - field: 02 Flight Identification
        rule: |
          Flight identification must be found.
        error: MsgFLIDNotStored
      - field: 02 Flight Identification
        rule: |
          Flight identification must not be found for more than one flight.
        error: MsgFLIDDuplication
      - field: 13 Facility Identifier
        rule: |
          Must be in the format L or LLL.
        error: MsgCofieFormat
