id: LC
variants:
  - title: Fix/Time Readout
    descriptor: FIX/TIME
    format: LC 68 65
    multiple_flids: null
    handler: LC.FixTime
    note: |
      yaat measures "now" from the sim session clock (session start plus elapsed sim seconds), not the wall clock: a typed HHMM is
      session time, so the 3-minute to 8-hour window and the midnight roll are against it. With no scenario loaded it answers
      SESSION NOT ACTIVE as DM does. The distance is the straight line to the fix (SRS "Determine Direct Speed Adjustment"), and the
      speed change is shown raw, with no clamp. The readout format "<required>KT <+/-delta>" is a yaat ruling; the SRS gives no LC
      readout format.
    fields:
      - field: 68 Fix or Fix Radial Distance with Intended Arrival Time
        rule: |
          Must be one of: a. Fix or Airport with intended arrival time - aa(a)(a)(a)/dddd;
          b. Fix (or Airport) Radial Distance with intended arrival time - aa(a)(a)(a)ddd1ddd2/dddd.
        error: MsgCofieFormat
      - field: 68 Fix or Fix Radial Distance with Intended Arrival Time
        rule: |
          When a Fix Radial Distance, the radial ddd1 must be between 001-360 and the distance ddd2
          must be between 001-999.
        error: MsgCofieFormat
      - field: 68 Fix or Fix Radial Distance with Intended Arrival Time
        rule: |
          The first two digits (hours) of the Intended Arrival Time must not exceed 23 and the last two
          digits (minutes) must not exceed 59.
        error: MsgInvalidTime
      - field: 68 Fix or Fix Radial Distance with Intended Arrival Time
        rule: |
          The Intended Arrival Time must be at least 3 minutes in the future and less than 8 hours in the future.
        error: MsgInvalidTime
      - field: 65 Trackball Coordinates
        rule: |
          Must be created by a trackball entry.
        error: MsgCofieFormat
      - field: 65 Trackball Coordinates
        rule: |
          When selecting the flight by trackball, the selection must capture a Track Position Symbol
          (Paired Flight) for a valid flight ID (R-Position only). The capture must contain a paired
          flight position symbol.
        error: MsgNoTBFlightID
