id: HM
variants:
  - title: Hold
    descriptor: HOLD
    format: HM 02* 21 310 | HM 02* 21 | HM 02* 310 | HM 02 21 310 | HM 02 21 | HM 02 310
    multiple_flids: false
    handler: HM.Hold
    note: >-
      yaat stores the hold as the flight's hold annotation (display data only, no flight behaviour; 7110.65 §5-13-9), recorded
      so a replay rebuilds it, and the QF readout appends it as HOLD <fix> [<dir>/<LT|RT>/<leg>] [EFC hhmm]. A location or P
      in field 21 is a new hold that carries only what field 310 gives: a fix-only entry leaves direction, turns and leg blank
      (§5-13-9a.4, §4-6-4e: no defaults the controller did not issue). CRC's hold DTO has no unset value, so while the Sim
      stores them blank, CRC receives Northwest and right turns (the standard pattern, AIM 5-3-8j.1(a)) and no leg length.
      An EFC of 0000 is stored and read out as EFC 0000, but CRC's EFC is a plain int, so it receives 0 for both 0000 and
      no EFC. A field 310 radial is kept as entered and shown to CRC as the nearest of the 8 compass points to the radial
      itself (not its reciprocal). An FRD or
      lat/long location is stored as typed; P stores the aircraft's position at entry as ddmmN/dddmmW. An EFC time alone, /*
      and field 310 alone change only that part of the stored hold (MESSAGE TOO SHORT when none is stored); * clears the
      instructions; C clears the hold (INVALID COMBINATION with a field 310). Only the track's owner may enter it
      (NOT YOUR CONTROL); the field 02 /OK suffix is a D/A-position option, so an R-position HM never overrides.
    fields:
      - field: 02 Flight Identification
        rule: |
          Must be one of: a. Aircraft ID with optional departure point - Laa(a)(a)(a)(a)(/aa(a)(a)(a)) or
          Ld(/aa(a)(a)(a)) or Laa(a)(a)(a)(a)(/aa(a)(a)(a)ddd1ddd2) or Ld(/aa(a)(a)(a)ddd1ddd2) or
          Laa(a)(a)(a)(a)(/dddd(L1)/(d)dddd(L2)) or Ld(/dddd(L1)/(d)dddd(L2)); b. CID - ddd or daa (where
          a must not equal "I" or "O"); c. Beacon Code - dddd (all digits octal).
          Field 02 may be suffixed with the logic check override (/OK) when the source is a D or A Position.
        error: MsgFlidFormat
      - field: 02 Flight Identification
        rule: |
          When a beacon code, must be a discrete beacon code, i.e. last two digits must not be 00.
        error: MsgIllegalFlightID
      - field: 02 Flight Identification
        rule: |
          Flight identification must be found.
        error: MsgFLIDNotStored
      - field: 02 Flight Identification
        rule: |
          Flight identification must not be found for more than one flight.
        error: MsgFLIDDuplication
      - field: 21 Hold Data
        rule: |
          Must be one of:
          a. Fix or Airport Name with optional EFC time - aa(a)(a)(a)(/dddd)
          b. Fix (or Airport) Radial Distance with optional EFC time - aa(a)(a)(a)ddd1ddd2(/dddd)
          c. Lat/Long with optional EFC time - dddd(L1)/(d)dddd(L2)(/dddd)
          d. Fix or Airport Name with optional EFC Time Deletion Indicator - aa(a)(a)(a)(/*)
          e. Fix (or Airport) Radial Distance with optional EFC Time Deletion Indicator - aa(a)(a)(a)ddd1ddd2(/*)
          f. Lat/Long with optional EFC Time Deletion Indicator - dddd(L1)/(d)dddd(L2)(/*)
          g. Present Position Indicator with optional EFC time - P(/dddd)
          h. Present Position Indicator with optional EFC Time Deletion Indicator - P(/*)
          i. EFC Time Deletion Indicator - /*
          j. EFC Time - dddd
          k. Cancel hold indicator - "C".
          Note: 4 digits are interpreted as a time, not as a 4 character fix.
        error: MsgCofieFormat
      - field: 21 Hold Data
        rule: |
          When a Fix Radial Distance, the radial ddd1 must be between 001-360, and the distance ddd2 must be
          between 001-999.
        error: MsgCofieFormat
      - field: 21 Hold Data
        rule: |
          When a Lat/Long: latitude must not exceed 90, longitude must not exceed 180, minutes must not
          exceed 59. L1 may be N or S; L2 may be E or W. At 90 degrees latitude or 180 degrees longitude the
          minutes must be 0. N latitude and W longitude are implied when omitted; S latitude and E longitude
          must be entered if applicable. If the optional L1 or L2 is used, both must be used.
        error: MsgCofieFormat
      - field: 21 Hold Data
        rule: |
          When in time format, or when an optional time is included, first two digits (hours) must not
          exceed 23 and last two digits (minutes) must not exceed 59.
        error: MsgInvalidTime
      - field: 310 Holding Instructions
        rule: |
          Must be one of:
          a. Cardinal direction - (L)L/LL/(a)(a)aaa, where (L)L must be "NW", "N", "NE", "E", "SE", "S",
             "SW", or "W"; LL must be "LT" or "RT"; (a)aaa must be "STD", (d)dNM, or dMIN.
          b. Inbound radial in degrees - ddd/LL/(a)(a)aaa, where ddd must be in the range 001-360; LL must
             be "LT" or "RT"; (a)aaa must be (d)dNM, or dMIN.
          c. Delete Holding Instructions - must be *.
          For "NM", (d)d must be in the range 1 to 99; for "MIN", d must be in the range 1 to 9.
        error: MsgCofieFormat
