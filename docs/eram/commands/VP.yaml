id: VP
variants:
  - title: VFR Abbreviated Flight Plan
    descriptor: ABBREVIATED FP
    format: VP 03 10 02
    multiple_flids: false
    handler: VP.AbbreviatedFp
    fields:
      - field: 02 Flight Identification
        rule: |
          Must be one of: a. Aircraft ID Laa(a)(a)(a)(a) or Ld; b. CID ddd or daa (a must not equal "I" or "O");
          c. Beacon Code dddd (all digits octal); d. Trackball Pick or Trackball Enter (Trackball Symbol o).
        error: MsgFlidFormat
      - field: 02 Flight Identification
        rule: |
          A trackball selection must capture a Track Position Symbol (Paired Flight), Tear-Off Flight Entry or
          View Flight Entry for a valid flight ID (R-Position only).
        error: MsgNoTBFlightID
      - field: 02 Flight Identification
        rule: |
          When a beacon code, must be a discrete beacon code, i.e. last two digits must not be 00.
        error: MsgIllegalFlightID
      - field: 02 Flight Identification
        rule: |
          Flight identification must be found.
        error: MsgFLIDNotStored
      - field: 02 Flight Identification
        rule: |
          Flight identification must not be found for more than one flight.
        error: MsgFLIDDuplication
      - field: 03 Aircraft Data
        rule: |
          Must be in the format ((d)(d)L/)La(a)(a)(/L) or ((d)d/)La(a)(a)(/L).
        error: MsgTYPFormat
      - field: 03a Aircraft Data (Special Aircraft Indicator)
        rule: |
          The Special Aircraft Indicator in element a of Field 03 (the L in the (d)(d)L), if present, must be "H".
        error: MsgSAIFormat
      - field: 10 Route
        rule: |
          Must consist of at least 2 characters.
        error: MsgRTEFormat
