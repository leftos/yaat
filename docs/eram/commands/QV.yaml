id: QV
variants:
  - title: Quick Vector
    descriptor: QUICK VECTOR
    format: QV (05) (56) 02 | QV
    multiple_flids: false
    handler: QV.QuickVector
    note: Console-local user-requested velocity vector (EDSM (L)); changes no host state and CRC has no DTO to draw it — validate and accept only (yaat ruling)
    fields:
      - field: Position
        rule: |
          When entered at the D-Position, the D-Position must have an adapted R-Position.
        error: MsgR-PositionNotConfigured
        na: CRC always enters commands from the R-Position.
      - field: 05 Speed
        rule: |
          True air speed (knots), format S(d)(d)dd, with the four digits greater than 0 and not to exceed 3700.
        error: MsgSPDFormat
      - field: 56 Heading
        rule: |
          Must be in the format dd, not to exceed 36.
        error: MsgCofieFormat
      - field: 02 Flight Identification
        rule: |
          Must be one of: a. Aircraft ID Laa(a)(a)(a)(a) or Ld; b. CID ddd or daa (a must not equal "I" or "O");
          c. Beacon Code dddd (all digits octal); d. Trackball Pick or Trackball Enter.
        error: MsgFlidFormat
      - field: 02 Flight Identification
        rule: |
          A trackball selection must capture a Track Position Symbol (Paired Flight), Tear-Off Flight Entry or
          View Flight Entry for a valid flight ID (R-Position only).
        error: MsgNoTBFlightID
      - field: 02 Flight Identification
        rule: |
          When a beacon code, must be a discrete beacon code, i.e. last two digits must not be 00.
        error: MsgIllegalFlightID
      - field: 02 Flight Identification
        rule: |
          Flight identification must be found.
        error: MsgFLIDNotStored
      - field: 02 Flight Identification
        rule: |
          Flight identification must not be found for more than one flight.
        error: MsgFLIDDuplication
