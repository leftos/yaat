# The literal text yaat-server sends in CRC's feedback area for each ERAM error.
# The spec names each error by ID only; see README.md for how the text was chosen.
#   source: crc     CRC shows this exact text for its own locally handled commands
#           spec    the spec gives this text literally
#           coined  our wording, in CRC's style
#   {cofie} is replaced by the contents of the field in error.

errors:
  # Message-level
  - { id: MsgInvalidMessageType, text: INVALID MESSAGE TYPE, source: coined }
  - { id: MsgIllegalSource, text: ILLEGAL SOURCE, source: coined }
  - { id: MsgMessageTypeMessageFailed, text: MESSAGE FAILED, source: coined }
