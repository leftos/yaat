# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Commits run only checks scoped to the staged files; the warnings-as-errors build runs at pre-push.
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-merge-conflict" },
    { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '\.(bat|cmd)$' },
    { id = "detect-private-key", exclude = "tools/discord-bot/" },
    # 20 MB ceiling: the recording test bundles (tests/Yaat.Sim.Tests/TestData/*.zip) are
    # committed as regular Git objects (not Git LFS) and the largest snapshot-bearing
    # bundles run to ~14 MB. The ceiling still catches genuinely oversized accidental commits.
    { id = "check-added-large-files", args = ["--maxkb=20480"], stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.5"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

[[repos]]
repo = "local"

# Replaces builtin `trailing-whitespace` + `end-of-file-fixer`: applies the same
# fixes but auto-stages the result so the commit proceeds instead of failing
# with "files were modified by this hook".
[[repos.hooks]]
id = "whitespace-fix-autostage"
name = "trim trailing whitespace + EOF newline (auto-stages fixes)"
entry = "bash tools/hooks/whitespace-fix-autostage.sh"
language = "system"
types = ["text"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "dotnet-format-style"
name = "dotnet format style (info)"
entry = "bash tools/hooks/dotnet-format-wrapper.sh style info"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "csharpier"
name = "dotnet csharpier format (C# + XAML)"
entry = "bash tools/hooks/csharpier-wrapper.sh"
language = "system"
files = '\.(cs|axaml)$'
require_serial = true
stages = ["pre-commit"]

# Mirrors the CI guard in .github/workflows/ci.yml. The shipped HTML is opened
# by Help → Command Cheatsheet; a stale HTML would show users an out-of-date
# command list. Triggers only when the JSON, HTML, or generator script changes
# so day-to-day commits don't pay the cost.
[[repos.hooks]]
id = "cheatsheet-sync"
name = "command cheatsheet HTML in sync with JSON"
entry = "node tools/build-cheatsheet.mjs --check"
language = "system"
files = '^(docs/command-cheatsheet\.(json|html)|tools/build-cheatsheet\.mjs)$'
pass_filenames = false
stages = ["pre-commit"]

# `files` limits the build to pushes that can change its output: compile inputs,
# project/solution files, analyzer config, and every extension a csproj `Include`s
# as content or a resource (embedded JSON/geojson/tsv/ttf/png, Avalonia .axaml,
# LayoutInspector's html/css/js). Docs-, plan- or recording-only pushes skip it.
# Warn-level analyzer diagnostics fail this build, so no separate analyzers hook runs.
[[repos.hooks]]
id = "dotnet-build"
name = "dotnet build (warnings as errors)"
entry = "pwsh -NoProfile -File tools/gate.ps1 -Log .tmp/prek-dotnet-build.log -TimeoutSeconds 900 -Slot heavy -- dotnet build -p:TreatWarningsAsErrors=true"
language = "system"
files = '\.(cs|csproj|slnx?|props|targets|axaml|xaml|resx|razor|cshtml|proto|json|geojson|cifp|tsv|br|ttf|otf|png|ico|svg|html|css|js|onnx|pem|txt|config|editorconfig|globalconfig|ruleset|baseline)$'
pass_filenames = false
stages = ["pre-push"]
