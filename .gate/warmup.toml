# Builds that make routed runs on the gate builder incremental: `pwsh tools/test-all.ps1` (both repos, through its own
# -BuildOnly so the flags stay identical) and filtered `dotnet test <project> -c Release -- --filter-...` runs.
# Each command is one array of words, run in order in the worktree's builder work folder. The test projects come last:
# their filtered runs have the shortest ceilings.
commands = [
  ["pwsh", "tools/test-all.ps1", "-BuildOnly"],
  ["dotnet", "build", "tests/Yaat.Sim.Tests", "-c", "Release"],
  ["dotnet", "build", "tests/Yaat.Client.Tests", "-c", "Release"],
  ["dotnet", "build", "tests/Yaat.Client.UI.Tests", "-c", "Release"],
]
timeout = 2700
